{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Full name <input name="name" value="{{ name }}" required></label>
    <label>Email <input type="email" name="email" value="{{ email }}" required></label>
    <label>Password <input type="password" name="password" minlength="8" required></label>
    <label>Confirm password <input type="password" name="confirm" minlength="8" required></label>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
